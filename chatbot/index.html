<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ChatBot</title>
  <link rel="stylesheet" href="chatbot.css" />
</head>
<body>

  <div class="chatbot-wrapper">
    <div class="chatbot-container">

      <!-- Header -->
      <header class="chatbot-header">
        <div class="chatbot-avatar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2a4 4 0 0 1 4 4v2a4 4 0 0 1-8 0V6a4 4 0 0 1 4-4z"/>
            <rect x="4" y="10" width="16" height="10" rx="3"/>
            <circle cx="9" cy="15" r="1.5" fill="currentColor"/>
            <circle cx="15" cy="15" r="1.5" fill="currentColor"/>
          </svg>
        </div>
        <div>
          <h1 class="chatbot-title">ChatBot</h1>
          <span class="chatbot-status">● Online</span>
        </div>
      </header>

      <!-- Messages -->
      <div class="chatbot-messages" id="chatMessages">
        <div class="chatbot-bubble bot">
          <p>Hi there! 👋 How can I help you today?</p>
        </div>
      </div>

      <!-- Input Area -->
      <div class="chatbot-input-area">

        <!-- Attach file -->
        <button class="icon-btn" title="Attach file" onclick="document.getElementById('fileInput').click()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
          </svg>
        </button>
        <input type="file" id="fileInput" hidden />

        <!-- Attach image -->
        <button class="icon-btn" title="Attach image" onclick="document.getElementById('imageInput').click()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
            <circle cx="8.5" cy="8.5" r="1.5"/>
            <polyline points="21 15 16 10 5 21"/>
          </svg>
        </button>
        <input type="file" id="imageInput" accept="image/*" hidden />

        <!-- Search / message input -->
        <input
          type="text"
          id="chatInput"
          class="chat-input"
          placeholder="Type a message…"
          autocomplete="off"
        />

        <!-- Send button -->
        <button class="send-btn" id="sendBtn" title="Send">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"/>
            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>

      </div>
    </div>
  </div>

  <script>
    const chatMessages = document.getElementById('chatMessages');
    const chatInput    = document.getElementById('chatInput');
    const sendBtn      = document.getElementById('sendBtn');
    const fileInput    = document.getElementById('fileInput');
    const imageInput   = document.getElementById('imageInput');

    // ── helpers ──────────────────────────────────────────
    function addBubble(text, role) {
      const div = document.createElement('div');
      div.className = `chatbot-bubble ${role}`;
      div.innerHTML = `<p>${text}</p>`;
      chatMessages.appendChild(div);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function showTyping() {
      const div = document.createElement('div');
      div.className = 'chatbot-bubble bot typing';
      div.innerHTML = '<div class="typing-indicator"><span></span><span></span><span></span></div>';
      chatMessages.appendChild(div);
      chatMessages.scrollTop = chatMessages.scrollHeight;
      return div;
    }

    // ── bot reply (simple echo for demo) ────────────────
    function getBotReply(userText) {
      const lower = userText.toLowerCase();
      if (lower.includes('hello') || lower.includes('hi'))  return 'Hey! 😊 What can I do for you?';
      if (lower.includes('help'))   return 'Sure — just describe what you need and I'll do my best!';
      if (lower.includes('bye'))    return 'Goodbye! Have a great day! 👋';
      return `You said: "${userText}"`;
    }

    // ── send message ────────────────────────────────────
    function sendMessage() {
      const text = chatInput.value.trim();
      if (!text) return;

      addBubble(text, 'user');
      chatInput.value = '';

      const loader = showTyping();

      setTimeout(() => {
        loader.remove();
        addBubble(getBotReply(text), 'bot');
      }, 800);
    }

    // ── event listeners ─────────────────────────────────
    sendBtn.addEventListener('click', sendMessage);

    chatInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') sendMessage();
    });

    fileInput.addEventListener('change', (e) => {
      if (e.target.files[0]) addBubble(`📎 ${e.target.files[0].name}`, 'user');
      e.target.value = '';
    });

    imageInput.addEventListener('change', (e) => {
      if (e.target.files[0]) addBubble(`🖼️ ${e.target.files[0].name}`, 'user');
      e.target.value = '';
    });
  </script>

</body>
</html>
