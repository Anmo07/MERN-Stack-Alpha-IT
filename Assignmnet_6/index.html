<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Record Processing System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <header>
            <h1>Student Record Processing System</h1>
        </header>
        <main>
            <div id="display" class="display-box">
                <h3 class="section-title">Initial Student Data:</h3>
                <ul id="initial-list" class="student-list"></ul>
                <p id="status" class="status-message">Processing Student Records, please wait...</p>

                <div id="results-section" class="hidden">
                    <h3 class="section-title">Results Processed Successfully:</h3>
                    <ul id="results-list" class="student-list"></ul>
                </div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
